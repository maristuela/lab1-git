name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run syntax check
        run: python -m py_compile calculator.py stats.py main.py report.py
      
      - name: Run tests (если есть)
        run: echo "CI passed"

      - name: Custom Secret Scan
        run: |
          echo "Сканируем файлы на наличие секретов..."
          # Ищем паттерны токенов GitHub и ключей AWS
          if grep -rE "ghp_[a-zA-Z0-9]{36}|AKIA[0-9A-Z]{16}" --exclude-dir=.git . ; then
            echo "ОШИБКА: Найден секрет!"
            exit 1
          else
            echo "Секретов не найдено. Всё чисто."
          fi
