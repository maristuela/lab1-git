name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run syntax check
        run: python -m py_compile calculator.py stats.py main.py report.py
      
      - name: Run tests (если есть)
        run: echo "CI passed"

      # Единственный правильный вариант шага для TruffleHog
      - name: TruffleHog Secret Scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/pwd" \
            trufflesecurity/trufflehog:latest filesystem /pwd \
            --results=verified,unknown,unverified
