name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Обязательно для TruffleHog, чтобы видеть историю

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run syntax check
        # Если файлов нет, шаг упадет. Лучше убедиться, что они есть.
        run: python -m py_compile calculator.py stats.py main.py report.py
      
      - name: Run tests (если есть)
        run: echo "CI passed"

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main # Используем main для актуальности
        with:
          path: ./
          extra_args: --results=verified,unknown,unverified --debug
